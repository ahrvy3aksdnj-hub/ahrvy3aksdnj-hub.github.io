<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fafafa;
}

/* =========================
   헤더
========================= */
.header {
  position: relative;
  height: 70px;
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #eee;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 2px;
}

/* =========================
   Nan + main 버튼
========================= */
.logo-box {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.logo-wrap {
  position: relative;
  width: 160px;
  height: 60px;
}

/* main 60x60 */
.main-image-box {
  position: relative;
  width: 60px;
  height: 60px;
}

.logo-base,
.logo-hover {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: 0.3s;
}

.logo-base { opacity: 1; }
.logo-hover { opacity: 0; }

.main2,
.main1 {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: 0.3s;
}

.main2 { opacity: 1; }
.main1 { opacity: 0; }

.logo-box:hover .logo-base { opacity: 0; }
.logo-box:hover .logo-hover { opacity: 1; }
.logo-box:hover .main2 { opacity: 0; }
.logo-box:hover .main1 { opacity: 1; }

/* =========================
   메뉴
========================= */
.catalog {
  display: flex;
  gap: 28px;
  margin-left: 25px;
}

.catalog-item {
  cursor: pointer;
  font-size: 15px;
  transition: 0.2s;
}

.catalog-item:hover {
  opacity: 0.6;
}

/* =========================
   검색창
========================= */
.search-box {
  position: absolute;
  top: 15px;
  right: 20px;
  display: flex;
  gap: 10px;
}

.search-box input {
  width: 280px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  outline: none;
}

.search-box button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #111;
  color: #fff;
  cursor: pointer;
}

/* =========================
   이미지 그리드
========================= */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 20px 40px 40px;
}

.card {
  height: 300px;
  border-radius: 12px;
  overflow: hidden;
  background: #eee;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.25s;
}

.card:hover img {
  transform: scale(1.05);
}
</style>
</head>

<body>

<!-- =========================
   헤더
========================= -->
<div class="header">

  <div class="header-left">

    <div class="logo-box" onclick="goHome()">

      <div class="logo-wrap">
        <img class="logo-base" src="images/Nan2.png">
        <img class="logo-hover" src="images/Nan1.png">
      </div>

      <div class="main-image-box">
        <img class="main2" src="images/main2.jpg">
        <img class="main1" src="images/main1.gif">
      </div>

    </div>

    <!-- =========================
         카테고리 (링크 연결)
    ========================= -->
    <div class="catalog">
      <div class="catalog-item" onclick="location.href='https://map.naver.com'">네이버</div>
      <div class="catalog-item" onclick="location.href='https://www.youtube.com'">유튜브</div>
      <div class="catalog-item" onclick="location.href='https://music.youtube.com'">뮤직</div>
      <div class="catalog-item" onclick="location.href='https://github.com'">허브</div>
    </div>

  </div>

  <!-- 검색 -->
  <div class="search-box">
    <input id="query" placeholder="타카나시 호시노 검색">
    <button onclick="searchImages()">검색</button>
  </div>

</div>

<!-- =========================
   결과 영역
========================= -->
<div class="grid" id="grid"></div>

<script>
function goHome() {
  location.reload();
}

const grid = document.getElementById("grid");

async function searchImages() {
  const q = document.getElementById("query").value || "타카나시 호시노";

  grid.innerHTML = "";

  const API_KEY = "YOUR_API_KEY";
  const CX = "YOUR_CX_ID";

  const url = `https://www.googleapis.com/customsearch/v1?q=${q}&cx=${CX}&key=${API_KEY}&searchType=image&num=9`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    const items = data.items || [];

    items.slice(0, 9).forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = item.link;

      card.appendChild(img);
      grid.appendChild(card);
    });

  } catch (e) {
    console.log(e);
    grid.innerHTML = "<p>이미지 로딩 실패 (API 설정 필요)</p>";
  }
}
</script>

</body>
</html>
