<!DOCTYPE html>
<html>
<head>
  <title>AI 메모장</title>
  <style>
    <body>

<h1>📝 내 메모장</h1>

<textarea id="memo" placeholder="여기에 메모 쓰기..."></textarea>

<br>

<button onclick="saveMemo()">저장</button>
<button onclick="clearMemo()">초기화</button>

<script>
  const memo = document.getElementById("memo");

  // 불러오기
  memo.value = localStorage.getItem("mymemo") || "";

  function saveMemo() {
    localStorage.setItem("mymemo", memo.value);
    alert("저장됨!");
  }

  function clearMemo() {
    localStorage.removeItem("mymemo");
    memo.value = "";
  }
</script>

</body>
