<!DOCTYPE html>
<html>
<head>
  <title>AI 메모장</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: url("https://i.pinimg.com/736x/f3/9d/fc/f39dfcbfebe79681d8197408e8633e40.jpg") no-repeat center center fixed;
      background-size: cover;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: -1;
    }

    /* ===== 사이드 메모 버튼 ===== */
    .launcher {
      position: fixed;
      left: 10px;
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-weight: bold;
      user-select: none;
    }

    /* ===== 메모 패널 ===== */
    .panel {
      position: fixed;
      left: 0;
      top: 0;
      width: 320px;
      height: 100%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      transform: translateX(-100%);
      transition: 0.3s;
      padding: 15px;
      box-sizing: border-box;
    }

    .panel.open {
      transform: translateX(0);
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      resize: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #38bdf8;
      font-weight: bold;
    }

    /* ===== 저장 메모 영역 ===== */
    .notes {
      margin-left: 340px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .note {
      width: 180px;
      min-height: 120px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .note textarea {
      height: 80px;
      background: transparent;
      border: none;
      color: white;
      resize: none;
    }

    .note button {
      margin-top: 5px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<!-- ===== 메모 열기 버튼 ===== -->
<div class="launcher" onclick="togglePanel()">
  📝 메모 >>
</div>

<!-- ===== 메모 패널 ===== -->
<div class="panel" id="panel">

  <textarea id="input" placeholder="메모 작성..."></textarea>
  <button onclick="addNote()">저장</button>

</div>

<!-- ===== 저장된 메모 ===== -->
<div class="notes" id="notes"></div>

<script>
let panel = document.getElementById("panel");
let input = document.getElementById("input");
let notesDiv = document.getElementById("notes");

let notes = JSON.parse(localStorage.getItem("notes") || "[]");

function togglePanel() {
  panel.classList.toggle("open");
}

function save() {
  localStorage.setItem("notes", JSON.stringify(notes));
  render();
}

function addNote() {
  if (!input.value.trim()) return;

  notes.push(input.value);
  input.value = "";
  save();
}

function deleteNote(i) {
  notes.splice(i, 1);
  save();
}

function editNote(i) {
  let v = prompt("수정:", notes[i]);
  if (v !== null) {
    notes[i] = v;
    save();
  }
}

function render() {
  notesDiv.innerHTML = "";

  notes.forEach((n, i) => {
    let div = document.createElement("div");
    div.className = "note";

    div.innerHTML = `
      <textarea onchange="update(${i}, this.value)">${n}</textarea>
      <button onclick="editNote(${i})">수정</button>
      <button onclick="deleteNote(${i})">삭제</button>
    `;

    notesDiv.appendChild(div);
  });
}

function update(i, v) {
  notes[i] = v;
  save();
}

render();
</script>

</body>
</html>
