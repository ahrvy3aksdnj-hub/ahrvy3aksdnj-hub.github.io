<!DOCTYPE html>
<html>
<head>
  <title>hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0d14;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    /* 네온 분위기 배경 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(120, 80, 255, 0.18), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.12), transparent 50%);
      z-index: 0;
    }

    /* 상단 */
    .title {
      text-align: center;
      margin-top: 50px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(120,160,255,0.5);
      position: relative;
      z-index: 2;
    }

    /* 카드 그리드 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      gap: 18px;
      justify-content: center;
      margin-top: 80px;
      position: relative;
      z-index: 2;
    }

    /* 카드 */
    .card {
      width: 160px;
      height: 120px;

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 14px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-6px);
      border: 1px solid rgba(120,160,255,0.6);
      box-shadow: 0 0 25px rgba(120,160,255,0.3);
    }

    .icon {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .label {
      font-size: 13px;
      opacity: 0.8;
    }

    /* 하단 */
    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      opacity: 0.4;
      z-index: 2;
    }
  </style>
</head>

<body>

<div class="title">hub</div>

<div class="grid">

  <div class="card" onclick="go('https://www.naver.com')">
    <div class="icon">N</div>
    <div class="label">Naver</div>
  </div>

  <div class="card" onclick="go('https://www.youtube.com')">
    <div class="icon">▶</div>
    <div class="label">YouTube</div>
  </div>

  <div class="card" onclick="go('https://github.com')">
    <div class="icon">G</div>
    <div class="label">GitHub</div>
  </div>

  <div class="card" onclick="go('https://chat.openai.com')">
    <div class="icon">AI</div>
    <div class="label">Chat</div>
  </div>

  <div class="card" onclick="go('https://www.google.com')">
    <div class="icon">S</div>
    <div class="label">Search</div>
  </div>

  <div class="card" onclick="go('#')">
    <div class="icon">+</div>
    <div class="label">Add</div>
  </div>

</div>

<div class="footer">dashboard</div>

<script>
function go(url) {
  if(url !== '#') window.open(url, '_blank');
}
</script>

</body>
</html>
