<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#fafafa;
}

/* =========================
   헤더
========================= */

.header{
  position:relative;
  height:70px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid #eee;
}

.header-left{
  display:flex;
  align-items:center;
  gap:2px;
}

/* =========================
   로고
========================= */

.logo-box{
  display:flex;
  align-items:center;
  cursor:pointer;
}

.logo-wrap{
  position:relative;
  width:160px;
  height:60px;
}

.main-image-box{
  position:relative;
  width:60px;
  height:60px;
}

.logo-base,
.logo-hover,
.main1,
.main2{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  transition:0.3s;
}

.logo-base{ opacity:1; }
.logo-hover{ opacity:0; }

.main2{ opacity:1; }
.main1{ opacity:0; }

.logo-box:hover .logo-base{
  opacity:0;
}

.logo-box:hover .logo-hover{
  opacity:1;
}

.logo-box:hover .main2{
  opacity:0;
}

.logo-box:hover .main1{
  opacity:1;
}

/* =========================
   메뉴
========================= */

.catalog{
  display:flex;
  gap:28px;
  margin-left:25px;
}

.catalog-item{
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
  user-select:none;
}

.catalog-item:hover{
  opacity:0.6;
}

/* =========================
   검색창
========================= */

.search-box{
  position:absolute;
  top:15px;
  right:20px;
  display:flex;
  gap:10px;
}

.search-box input{
  width:280px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
}

.search-box button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#111;
  color:white;
  cursor:pointer;
}

/* =========================
   결과 카드
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  padding:30px;
}

.card{
  background:#222;
  color:white;
  border-radius:14px;
  padding:25px;
  box-sizing:border-box;
  min-height:220px;
  transition:0.25s;
}

.card:hover{
  transform:translateY(-4px);
}

.card h2{
  margin-top:0;
  font-size:28px;
}

.card p{
  font-size:18px;
  line-height:1.8;
}

.loading{
  padding:60px;
  font-size:22px;
  color:#666;
}

</style>
</head>

<body>

<div class="header">

  <div class="header-left">

    <div class="logo-box" onclick="goHome()">

      <div class="logo-wrap">
        <img class="logo-base" src="images/Nan2.png">
        <img class="logo-hover" src="images/Nan1.png">
      </div>

      <div class="main-image-box">
        <img class="main2" src="images/main2.jpg">
        <img class="main1" src="images/main1.gif">
      </div>

    </div>

    <div class="catalog">

      <div class="catalog-item"
      onclick="window.open('https://lostark.game.onstove.com','_blank')">
      로스트아크
      </div>

      <div class="catalog-item"
      onclick="window.open('https://www.youtube.com','_blank')">
      유튜브
      </div>

      <div class="catalog-item"
      onclick="window.open('https://github.com','_blank')">
      허브
      </div>

    </div>

  </div>

  <div class="search-box">

    <input
      id="query"
      placeholder="캐릭터 이름 검색"
      onkeydown="handleEnter(event)"
    >

    <button onclick="searchCharacter()">
      검색
    </button>

  </div>

</div>

<div class="grid" id="grid"></div>

<script>

function goHome(){
  location.reload();
}

const grid =
document.getElementById("grid");

function handleEnter(event){
  if(event.key === "Enter"){
    searchCharacter();
  }
}

/* =========================
   🔥 수정 핵심 부분
========================= */

async function searchCharacter(){

  const q =
  document.getElementById("query").value;

  if(!q) return;

  grid.innerHTML =
  `<div class="loading">
    캐릭터 불러오는 중...
  </div>`;

  try{

    const res = await fetch(
      `https://lostark-server.onrender.com/character/${encodeURIComponent(q)}`
    );

    const data = await res.json();

    grid.innerHTML = "";

    if(!data || data.length === 0){

      grid.innerHTML =
      `<div class="loading">
        캐릭터 없음
      </div>`;

      return;
    }

    data.forEach(char => {

      const card =
      document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <h2>${char.CharacterName}</h2>

        <p>서버 : ${char.ServerName}</p>

        <p>직업 : ${char.CharacterClassName}</p>

        <p>아이템 레벨 : ${char.ItemAvgLevel}</p>
      `;

      grid.appendChild(card);

    });

  }catch(e){

    console.log(e);

    grid.innerHTML =
    `<div class="loading">
      API 연결 실패
    </div>`;

  }

}

</script>

</body>
</html>
