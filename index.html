<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fafafa;
}

/* =========================
   헤더
========================= */
.header {
  height: 70px;
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #eee;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 2px;
}

/* =========================
   Nan + main 버튼
========================= */
.logo-box {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.logo-wrap {
  position: relative;
  width: 160px;
  height: 60px;
}

/* 🔥 main 60x60 적용 */
.main-image-box {
  position: relative;
  width: 60px;
  height: 60px;
}

/* Nan */
.logo-base,
.logo-hover {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: 0.3s;
}

.logo-base { opacity: 1; }
.logo-hover { opacity: 0; }

/* main */
.main2,
.main1 {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: 0.3s;
}

.main2 { opacity: 1; }
.main1 { opacity: 0; }

/* hover 공유 */
.logo-box:hover .logo-base { opacity: 0; }
.logo-box:hover .logo-hover { opacity: 1; }
.logo-box:hover .main2 { opacity: 0; }
.logo-box:hover .main1 { opacity: 1; }

/* 메뉴 */
.catalog {
  display: flex;
  gap: 28px;
  margin-left: 25px;
}

.catalog-item {
  cursor: pointer;
}

/* =========================
   🔍 검색 영역 (구글 스타일)
========================= */
.search-box {
  margin: 20px 40px;
  display: flex;
  gap: 10px;
}

.search-box input {
  width: 300px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.search-box button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: #111;
  color: #fff;
  cursor: pointer;
}

/* =========================
   이미지 결과 (구글 느낌)
========================= */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 40px 40px;
}

.card {
  width: 100%;
  height: 300px;
  overflow: hidden;
  border-radius: 12px;
  background: #eee;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.25s;
}

.card:hover img {
  transform: scale(1.05);
}
</style>
</head>

<body>

<!-- =========================
   헤더
========================= -->
<div class="header">
  <div class="header-left">

    <div class="logo-box" onclick="goHome()">

      <div class="logo-wrap">
        <img class="logo-base" src="images/Nan2.png">
        <img class="logo-hover" src="images/Nan1.png">
      </div>

      <div class="main-image-box">
        <img class="main2" src="images/main2.jpg">
        <img class="main1" src="images/main1.gif">
      </div>

    </div>

    <div class="catalog">
      <div class="catalog-item">로아</div>
      <div class="catalog-item">유튜브</div>
      <div class="catalog-item">네이버</div>
      <div class="catalog-item">뮤직</div>
    </div>

  </div>
</div>

<!-- =========================
   🔍 검색창
========================= -->
<div class="search-box">
  <input id="query" placeholder="타카나시 호시노 검색">
  <button onclick="searchImages()">검색</button>
</div>

<!-- =========================
   결과 영역
========================= -->
<div class="grid" id="grid"></div>

<script>
function goHome() {
  location.reload();
}

const grid = document.getElementById("grid");

/* 🔥 Google Custom Search API 구조 */
async function searchImages() {
  const q = document.getElementById("query").value || "타카나시 호시노";

  grid.innerHTML = "";

  // ⚠️ 여기에 너 API 키 넣어야 함
  const API_KEY = "YOUR_API_KEY";
  const CX = "YOUR_CX_ID";

  const url = `https://www.googleapis.com/customsearch/v1?q=${q}&cx=${CX}&key=${API_KEY}&searchType=image&num=9`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    const items = data.items || [];

    items.slice(0, 9).forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = item.link;

      card.appendChild(img);
      grid.appendChild(card);
    });

  } catch (e) {
    console.log(e);

    grid.innerHTML = "<p>이미지를 불러올 수 없습니다 (API 설정 필요)</p>";
  }
}
</script>

</body>
</html>
