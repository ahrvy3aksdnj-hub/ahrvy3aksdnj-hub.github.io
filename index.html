<!DOCTYPE html>
<html>
<head>
  <title>AI 메모장</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 네온 배경 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(120, 80, 255, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.12), transparent 45%);
      z-index: 0;
    }

    /* ===== 제목 ===== */
    h1 {
      text-align: center;
      margin-top: 40px;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 18px rgba(120,160,255,0.6);
      position: relative;
      z-index: 2;
    }

    /* ===== 입력 영역 ===== */
    textarea {
      display: block;
      margin: 20px auto;
      width: 70%;
      max-width: 700px;
      height: 180px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 14px;

      color: white;
      padding: 12px;
      outline: none;

      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      transition: 0.2s;

      position: relative;
      z-index: 2;
      resize: none;
    }

    textarea:focus {
      border: 1px solid rgba(120,160,255,0.6);
      box-shadow: 0 0 25px rgba(120,160,255,0.25);
    }

    /* ===== 버튼 ===== */
    button {
      display: inline-block;
      margin: 5px;
      padding: 10px 16px;

      border: 1px solid rgba(120,160,255,0.3);
      border-radius: 12px;

      background: rgba(120,160,255,0.12);
      color: white;
      font-weight: bold;

      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(8px);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(120,160,255,0.4);
      border: 1px solid rgba(120,160,255,0.7);
    }

    /* ===== 메모 리스트 ===== */
    .notes {
      margin-top: 30px;
      padding: 20px;

      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;

      position: relative;
      z-index: 2;
    }

    /* ===== 메모 카드 ===== */
    .note {
      width: 180px;
      min-height: 120px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 14px;

      padding: 10px;
      backdrop-filter: blur(10px);

      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      transition: 0.2s;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .note:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 25px rgba(120,160,255,0.25);
    }

    .note textarea {
      height: 80px;
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      resize: none;
      margin: 0;
      box-shadow: none;
    }

    .note button {
      margin-top: 5px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<h1>📝 AI 메모장</h1>

<textarea id="input" placeholder="메모 작성..."></textarea>

<div style="text-align:center;">
  <button onclick="addNote()">저장</button>
</div>

<div class="notes" id="notes"></div>

<script>
let input = document.getElementById("input");
let notesDiv = document.getElementById("notes");

let notes = JSON.parse(localStorage.getItem("notes") || "[]");

function save() {
  localStorage.setItem("notes", JSON.stringify(notes));
  render();
}

function addNote() {
  if (!input.value.trim()) return;

  notes.push(input.value);
  input.value = "";
  save();
}

function deleteNote(i) {
  notes.splice(i, 1);
  save();
}

function editNote(i) {
  let v = prompt("수정:", notes[i]);
  if (v !== null) {
    notes[i] = v;
    save();
  }
}

function render() {
  notesDiv.innerHTML = "";

  notes.forEach((n, i) => {
    let div = document.createElement("div");
    div.className = "note";

    div.innerHTML = `
      <textarea onchange="update(${i}, this.value)">${n}</textarea>
      <button onclick="editNote(${i})">수정</button>
      <button onclick="deleteNote(${i})">삭제</button>
    `;

    notesDiv.appendChild(div);
  });
}

function update(i, v) {
  notes[i] = v;
  save();
}

render();
</script>

</body>
</html>
