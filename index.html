<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff;
}

/* =========================
   헤더
========================= */
.header {
  height: 70px;
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 2px;
}

/* =========================
   Nan + main 합체 버튼
========================= */
.logo-box {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.logo-wrap {
  position: relative;
  width: 160px;
  height: 60px;
}

.main-image-box {
  position: relative;
  width: 80px;
  height: 80px;
}

/* Nan */
.logo-base,
.logo-hover {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: 0.3s;
}

.logo-base { opacity: 1; }
.logo-hover { opacity: 0; }

/* main */
.main2,
.main1 {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: 0.3s;
}

.main2 { opacity: 1; }
.main1 { opacity: 0; }

/* hover 공유 */
.logo-box:hover .logo-base { opacity: 0; }
.logo-box:hover .logo-hover { opacity: 1; }
.logo-box:hover .main2 { opacity: 0; }
.logo-box:hover .main1 { opacity: 1; }

/* 메뉴 */
.catalog {
  display: flex;
  gap: 28px;
  margin-left: 25px;
}

.catalog-item {
  cursor: pointer;
  font-size: 16px;
}

.catalog-item:hover {
  color: #666;
}

/* =========================
   🌊 타카나시 호시노 갤러리
========================= */

.content {
  height: calc(100vh - 70px);
  display: flex;
  align-items: center;       /* 세로 중앙 */
  justify-content: flex-start; /* 왼쪽 정렬 */
  padding-left: 40px;
  background: #fafafa;
}

.gallery {
  display: flex;
  gap: 20px;
}

/* 카드 */
.card {
  width: 500px;
  height: 500px;
  overflow: hidden;
  border-radius: 14px;
  background: #eee;
  box-shadow: 0 4px 15px rgba(0,0,0,0.12);
  transition: 0.25s;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.25s;
}

.card:hover img {
  transform: scale(1.05);
}
</style>
</head>

<body>

<!-- =========================
     헤더
========================= -->
<div class="header">
  <div class="header-left">

    <div class="logo-box" onclick="goHome()">

      <div class="logo-wrap">
        <img class="logo-base" src="images/Nan2.png">
        <img class="logo-hover" src="images/Nan1.png">
      </div>

      <div class="main-image-box">
        <img class="main2" src="images/main2.jpg">
        <img class="main1" src="images/main1.gif">
      </div>

    </div>

    <div class="catalog">
      <div class="catalog-item">로아</div>
      <div class="catalog-item">유튜브</div>
      <div class="catalog-item">네이버</div>
      <div class="catalog-item">뮤직</div>
    </div>

  </div>
</div>

<!-- =========================
     🌊 메인 (타카나시 호시노 갤러리)
========================= -->
<div class="content">
  <div class="gallery" id="gallery"></div>
</div>

<script>
function goHome() {
  location.reload();
}

const gallery = document.getElementById("gallery");

function makeCard() {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");

  // 타카나시 호시노 느낌 랜덤 이미지
  const seed = Math.floor(Math.random() * 9999);
  img.src = `https://source.unsplash.com/1000x1000/?anime,girl,blue,school&sig=${seed}`;

  card.appendChild(img);
  return card;
}

// 🔥 딱 3개만
for (let i = 0; i < 3; i++) {
  gallery.appendChild(makeCard());
}
</script>

</body>
</html>
