<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

/* 상단바 */
.header {
  height: 60px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}

/* 난중 */
.logo {
  cursor: pointer;
  font-weight: bold;
  font-size: 20px;
}

/* 이미지 hover 박스 */
.main-box {
  position: relative;
  width: 200px;
  height: 200px;
  cursor: pointer;
}

/* 기본 이미지 */
.main2 {
  width: 200px;
  height: 200px;
  display: block;
  border: 1px solid #000;
}

/* hover 이미지 */
.main1 {
  width: 200px;
  height: 200px;
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  border: 1px solid #000;
}

/* hover 전환 */
.main-box:hover .main2 {
  display: none;
}

.main-box:hover .main1 {
  display: block;
}

/* 사이드바 */
.sidebar {
  position: fixed;
  top: 60px;
  left: 0;
  width: 180px;
  height: 100%;
  background: #222;
  color: white;
  padding-top: 20px;
}

.menu-item {
  padding: 15px;
  cursor: pointer;
}

.menu-item:hover {
  background: #333;
}

/* 콘텐츠 */
.content {
  margin-left: 200px;
  padding: 20px;
}

/* 메모 오버레이 */
.memo-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
}

.memo-box {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: white;
  padding: 15px;
  width: 300px;
}

textarea {
  width: 100%;
  height: 120px;
}

/* 노트 */
.note {
  background: #fff9a6;
  padding: 10px;
  margin: 10px;
  display: inline-block;
  width: 150px;
  min-height: 80px;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  position: relative;
}

.note button {
  position: absolute;
  top: 5px;
  right: 5px;
}
</style>
</head>

<body>

<!-- 상단 -->
<div class="header">
  <div class="logo" onclick="goHome()">난중</div>

  <!-- 이미지 영역 -->
  <a href="index.html" class="main-box">
    <img class="main2" src="images/main2.png" alt="main2">
    <img class="main1" src="images/main1.png" alt="main1">
  </a>
</div>

<!-- 사이드 -->
<div class="sidebar">
  <div class="menu-item" onclick="openLink('https://lostark.game.onstove.com')">로아</div>
  <div class="menu-item" onclick="openLink('https://youtube.com')">유튜브</div>
  <div class="menu-item" onclick="openLink('https://naver.com')">네이버</div>
  <div class="menu-item" onclick="openLink('https://music.youtube.com')">뮤직</div>
  <div class="menu-item" onclick="toggleMemo()">메모</div>
</div>

<!-- 콘텐츠 -->
<div class="content">
  <h2>홈 화면</h2>
  <div id="notesArea"></div>
</div>

<!-- 메모 -->
<div class="memo-overlay" id="memoOverlay">
  <div class="memo-box">
    <h3>메모</h3>
    <textarea id="memoText"></textarea>
    <br><br>
    <button onclick="saveMemo()">저장</button>
    <button onclick="toggleMemo()">닫기</button>
  </div>
</div>

<script>
let editIndex = null;

function goHome() {
  location.reload();
}

function openLink(url) {
  window.open(url, "_blank");
}

function toggleMemo() {
  const m = document.getElementById("memoOverlay");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

function saveMemo() {
  let text = document.getElementById("memoText").value;
  if (!text.trim()) return;

  let notes = JSON.parse(localStorage.getItem("notes") || "[]");

  if (editIndex !== null) {
    notes[editIndex] = text;
    editIndex = null;
  } else {
    notes.push(text);
  }

  localStorage.setItem("notes", JSON.stringify(notes));
  document.getElementById("memoText").value = "";
  toggleMemo();
  renderNotes();
}

function deleteNote(i) {
  let notes = JSON.parse(localStorage.getItem("notes") || "[]");
  notes.splice(i, 1);
  localStorage.setItem("notes", JSON.stringify(notes));
  renderNotes();
}

function editNote(i) {
  let notes = JSON.parse(localStorage.getItem("notes") || "[]");
  document.getElementById("memoText").value = notes[i];
  editIndex = i;
  toggleMemo();
}

function renderNotes() {
  let notes = JSON.parse(localStorage.getItem("notes") || "[]");
  let area = document.getElementById("notesArea");
  area.innerHTML = "";

  notes.forEach((n, i) => {
    area.innerHTML += `
      <div class="note">
        ${n}
        <button onclick="deleteNote(${i})">X</button>
        <button onclick="editNote(${i})" style="right:25px;">✏️</button>
      </div>
    `;
  });
}

renderNotes();
</script>

</body>
</html>
