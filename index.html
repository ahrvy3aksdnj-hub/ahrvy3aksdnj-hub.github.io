<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff;
}

/* 상단바 */
.header {
  height: 70px;
  background: #fff;
  border-bottom: 1px solid #000;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 15px;
}

/* 로고 영역 */
.logo-box {
  display: flex;
  align-items: center;
  cursor: pointer;
}

/* 🌊 로고 박스 (160x60) */
.logo-wrap {
  position: relative;
  width: 160px;
  height: 60px;
}

/* 기본 Nan1 */
.logo-base {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: opacity 0.3s ease;
}

/* 변화 Nan2 */
.logo-hover {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;

  clip-path: inset(100% 0 0 0);
}

/* hover 시 기본 숨김 */
.logo-box:hover .logo-base {
  opacity: 0;
}

/* 🌊 물 차오르는 효과 */
.logo-box:hover .logo-hover {
  animation: waterFill 0.7s ease forwards;
}

@keyframes waterFill {
  0% {
    clip-path: inset(100% 0 0 0);
  }
  100% {
    clip-path: inset(0 0 0 0);
  }
}

/* 사이드바 */
.sidebar {
  position: fixed;
  top: 70px;
  left: 0;
  width: 180px;
  height: 100%;
  background: #fff;
  border-right: 1px solid #000;
  padding-top: 20px;
}

.menu-item {
  padding: 15px;
  cursor: pointer;
}

.menu-item:hover {
  background: #eee;
}

/* 콘텐츠 */
.content {
  margin-left: 200px;
  padding: 20px;
}
</style>
</head>

<body>

<!-- 헤더 -->
<div class="header">

  <div class="logo-box" onclick="goHome()">

    <div class="logo-wrap">
      <img class="logo-base" src="images/Nan1.png" alt="Nan1">
      <img class="logo-hover" src="images/Nan2.png" alt="Nan2">
    </div>

  </div>

</div>

<!-- 사이드 -->
<div class="sidebar">
  <div class="menu-item">로아</div>
  <div class="menu-item">유튜브</div>
  <div class="menu-item">네이버</div>
  <div class="menu-item">뮤직</div>
</div>

<!-- 콘텐츠 -->
<div class="content">
  <h2>홈 화면</h2>
</div>

<script>
function goHome() {
  location.reload();
}
</script>

</body>
</html>
