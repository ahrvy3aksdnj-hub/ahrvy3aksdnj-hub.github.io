<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>난중</title>
<style>
  body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
  }

  /* HEADER */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    height: 60px;
    padding-left: 10px;
    background: white;
    z-index: 999;
  }

  /* TEXT AREA 120x60 */
  .logo-text {
    width: 120px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    transition: 0.2s ease;
  }

  .logo-text:hover {
    transform: scale(1.05);
    color: #222;
  }

  /* IMAGE 60x60 */
  .logo-img {
    width: 60px;
    height: 60px;
    object-fit: cover;
  }

  /* MAIN AREA */
  .main {
    margin-top: 80px;
    padding: 20px;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-text" id="logoText" onclick="goHome()">난중</div>
  <img
    id="logoImg"
    class="logo-img"
    src="https://i2.ruliweb.com/ori/26/01/29/19c089dafa7533147.gif?icon=4549"
    alt="logo"
  />
</div>

<!-- MAIN -->
<div class="main">
  <h1>메인 화면</h1>
  <p>여기에 사이트 콘텐츠가 들어갑니다.</p>
</div>

<script>
  const logoText = document.getElementById('logoText');
  const logoImg = document.getElementById('logoImg');

  const defaultImg = "https://i2.ruliweb.com/ori/26/01/29/19c089dafa7533147.gif?icon=4549";
  const hoverImg = "https://i3.ruliweb.com/img/26/02/22/19c84108eba5a09eb.webp";

  logoText.addEventListener('mouseenter', () => {
    logoImg.src = hoverImg;
  });

  logoText.addEventListener('mouseleave', () => {
    logoImg.src = defaultImg;
  });

  function goHome() {
    window.location.href = "/";
  }
</script>

</body>
</html>
