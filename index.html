<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>난중</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff;
}

/* 상단바 */
.header {
  height: 70px;
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
}

/* 왼쪽 영역 */
.header-left {
  display: flex;
  align-items: center;
}

/* =========================
   Nan 로고 (기존 유지)
========================= */
.logo-box {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.logo-wrap {
  position: relative;
  width: 160px;
  height: 60px;
}

/* 기본 Nan2 */
.logo-base {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 1;
  transition: opacity 0.3s ease;
}

/* hover Nan1 */
.logo-hover {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.logo-box:hover .logo-base {
  opacity: 0;
}

.logo-box:hover .logo-hover {
  opacity: 1;
}

/* =========================
   ✅ main 이미지 추가
========================= */

.main-image-box {
  position: relative;
  width: 120px;
  height: 60px;

  /* Nan 로고 옆 간격 */
  margin-left: 20px;

  cursor: pointer;
}

/* 평소 main2 */
.main2 {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;

  opacity: 1;
  transition: opacity 0.3s ease;
}

/* hover main1.gif */
.main1 {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;

  opacity: 0;
  transition: opacity 0.3s ease;
}

/* hover */
.main-image-box:hover .main2 {
  opacity: 0;
}

.main-image-box:hover .main1 {
  opacity: 1;
}

/* =========================
   가로 메뉴
========================= */
.catalog {
  display: flex;
  align-items: center;
  gap: 28px;

  margin-left: 25px;
}

.catalog-item {
  cursor: pointer;
  font-size: 16px;
  transition: 0.2s;
}

.catalog-item:hover {
  color: #666;
}

/* 콘텐츠 */
.content {
  padding: 30px;
}
</style>
</head>

<body>

<!-- 헤더 -->
<div class="header">

  <div class="header-left">

    <!-- 기존 Nan 로고 -->
    <div class="logo-box" onclick="goHome()">

      <div class="logo-wrap">

        <!-- 기본 -->
        <img class="logo-base" src="images/Nan2.png" alt="Nan2">

        <!-- hover -->
        <img class="logo-hover" src="images/Nan1.png" alt="Nan1">

      </div>

    </div>

    <!-- ✅ 새 main 이미지 -->
    <div class="main-image-box">

      <!-- 평소 -->
      <img class="main2" src="images/main2.jpg" alt="main2">

      <!-- hover -->
      <img class="main1" src="images/main1.gif" alt="main1">

    </div>

    <!-- 메뉴 -->
    <div class="catalog">
      <div class="catalog-item">로아</div>
      <div class="catalog-item">유튜브</div>
      <div class="catalog-item">네이버</div>
      <div class="catalog-item">뮤직</div>
    </div>

  </div>

</div>

<!-- 콘텐츠 -->
<div class="content">
  <h2>홈 화면</h2>
</div>

<script>
function goHome() {
  location.reload();
}
</script>

</body>
</html>
