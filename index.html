<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>난중</title>

<style>
  body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
  }

  /* HEADER */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    height: 60px;
    padding-left: 10px;
    background: white;
    z-index: 999;
  }

  .logo-text {
    width: 120px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    transition: 0.2s ease;
  }

  .logo-text:hover {
    transform: scale(1.05);
    color: #222;
  }

  .logo-img {
    width: 60px;
    height: 60px;
    object-fit: cover;
  }

  .main {
    margin-top: 80px;
    padding: 20px;
  }

  button {
    padding: 10px 15px;
    margin-top: 20px;
    cursor: pointer;
  }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-text" id="logoText" onclick="goHome()">난중</div>

  <!-- 🔥 GitHub 내부 이미지 -->
  <img
    id="logoImg"
    class="logo-img"
    src="assets/img/mainhosino1.gif"
    alt="logo"
  />
</div>

<!-- MAIN -->
<div class="main">
  <h1>메인 화면</h1>
  <p>여기에 사이트 콘텐츠가 들어갑니다.</p>

  <!-- 👉 페이지 이동 버튼 -->
  <button onclick="goPage1()">다음 페이지</button>
</div>

<script>
  const logoText = document.getElementById('logoText');
  const logoImg = document.getElementById('logoImg');

  // 🔥 로컬 이미지 경로 고정
  const defaultImg = "assets/img/mainhosino1.gif";
  const hoverImg = "assets/img/mainhosino2.jpg";

  logoText.addEventListener('mouseenter', () => {
    logoImg.src = hoverImg;
  });

  logoText.addEventListener('mouseleave', () => {
    logoImg.src = defaultImg;
  });

  function goHome() {
    window.location.href = "index.html";
  }

  function goPage1() {
    window.location.href = "page1.html";
  }
</script>

</body>
</html>
